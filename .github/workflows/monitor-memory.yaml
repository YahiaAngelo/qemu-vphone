name: Monitor memory dumps

on:
  push:
    paths:
      - monitor/hmp-cmds-target.c
      - tests/monitor/test-hmp-memory-dump.py
      - configs/devices/aarch64-softmmu/hmp-regression.mak
      - .github/workflows/monitor-memory.yaml
  pull_request:
    paths:
      - monitor/hmp-cmds-target.c
      - tests/monitor/test-hmp-memory-dump.py
      - configs/devices/aarch64-softmmu/hmp-regression.mak
      - .github/workflows/monitor-memory.yaml

permissions:
  contents: read

jobs:
  memory-dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.4'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config libglib2.0-dev libfdt-dev zlib1g-dev python3-venv
      - name: Install Meson
        env:
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/monitor-tools
        run: |
          uv tool install --python 3.12 meson==1.12.1
          echo "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"
      - name: Build the minimal ARM monitor fixture
        run: |
          mkdir build-monitor
          cd build-monitor
          ../configure --target-list=aarch64-softmmu --without-default-features \
            --without-default-devices --with-devices-aarch64=hmp-regression \
            --enable-tcg --enable-fdt --disable-werror --disable-install-blobs
          ninja -j 2 qemu-system-aarch64
      - name: Check instruction refusal and numeric memory reads
        run: uv run tests/monitor/test-hmp-memory-dump.py build-monitor/qemu-system-aarch64
